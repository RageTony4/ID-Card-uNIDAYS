<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B5C" />
      <stop offset="50%" stop-color="#001F3F" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <path id="textArcTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
    <path id="textArcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="91" fill="url(#blueGrad)"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Legend Text -->
  <text font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="900" font-size="13.5" fill="#FFE57F" letter-spacing="3.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      AIR UNIVERSITY
    </textPath>
  </text>
  <text font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="800" font-size="9" fill="#FFE57F" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      UNITED STATES AIR FORCE
    </textPath>
  </text>

  <!-- Inner Center Field -->
  <circle cx="100" cy="100" r="68" fill="url(#blueGrad)"/>

  <!-- Central Shield -->
  <path d="M 80,68 L 120,68 L 120,95 Q 120,122 100,134 Q 80,122 80,95 Z" fill="#0D2040" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Wings of Flight -->
  <!-- Left Wing -->
  <path d="M 80,90 Q 56,82 46,72 Q 62,88 78,98 Z" fill="url(#goldGrad)"/>
  <path d="M 80,97 Q 58,92 50,84 Q 65,97 78,103 Z" fill="url(#goldGrad)"/>
  <path d="M 80,104 Q 64,102 56,96 Q 68,105 78,108 Z" fill="url(#goldGrad)"/>

  <!-- Right Wing -->
  <path d="M 120,90 Q 144,82 154,72 Q 138,88 122,98 Z" fill="url(#goldGrad)"/>
  <path d="M 120,97 Q 142,92 150,84 Q 135,97 122,103 Z" fill="url(#goldGrad)"/>
  <path d="M 120,104 Q 136,102 144,96 Q 132,105 122,108 Z" fill="url(#goldGrad)"/>

  <!-- Torch of Knowledge & Wisdom inside Shield -->
  <!-- Flame -->
  <path d="M 100,74 C 95,80 97,85 100,89 C 103,85 105,80 100,74 Z" fill="#FF5722"/>
  <path d="M 100,78 C 98,82 99,85 100,88 C 101,85 102,82 100,78 Z" fill="#FFC107"/>
  <!-- Torch bowl -->
  <path d="M 94,89 L 106,89 L 103,96 L 97,96 Z" fill="url(#goldGrad)"/>
  <!-- Torch stem -->
  <path d="M 98,96 L 102,96 L 101,114 L 99,114 Z" fill="url(#goldGrad)"/>
  <!-- Base handle -->
  <ellipse cx="100" cy="115" rx="3.5" ry="2" fill="url(#goldGrad)"/>

  <!-- Stars -->
  <!-- Top Center Star -->
  <polygon points="100,56 101.8,61.5 107.5,61.5 102.9,64.9 104.7,70.3 100,67 95.3,70.3 97.1,64.9 92.5,61.5 98.2,61.5" fill="url(#goldGrad)"/>
  <!-- Left Star -->
  <polygon points="68,108 69.4,112.3 73.8,112.3 70.3,114.9 71.7,119.2 68,116.5 64.3,119.2 65.7,114.9 62.2,112.3 66.6,112.3" fill="url(#goldGrad)" transform="scale(0.8) translate(18, 12)"/>
  <!-- Right Star -->
  <polygon points="132,108 133.4,112.3 137.8,112.3 134.3,114.9 135.7,119.2 132,116.5 128.3,119.2 129.7,114.9 126.2,112.3 130.6,112.3" fill="url(#goldGrad)" transform="scale(0.8) translate(38, 12)"/>
</svg>
